version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: accommodation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: accommodation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
